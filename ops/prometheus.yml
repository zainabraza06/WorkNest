global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: worknest-api
    metrics_path: /metrics
    # Local: set METRICS_TOKEN in backend/.env and mirror it into ops/metrics_token (gitignored)
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: [backend:5000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
