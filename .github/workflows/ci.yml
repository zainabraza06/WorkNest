name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server downloads a ~600 MB server binary on first run
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      # The embedding model is ~67 MB; without this every run re-downloads it
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-${{ runner.os }}

      - run: pip install -r requirements-dev.txt
        working-directory: ai-service

      # Runs against the committed, checksum-pinned models
      - run: pytest -q
        working-directory: ai-service

  models:
    name: Model validation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: ai-service

      # The committed models must clear the bar as they are — no retraining here, because the
      # artifact that ships is the artifact that gets validated.
      - name: Validate committed models
        run: python scripts/validate_models.py
        working-directory: ai-service

      # Retraining must stay reproducible: same seeds, same data, same gates.
      - name: Retrain from scratch and re-validate
        working-directory: ai-service
        run: |
          python scripts/build_rate_anchors.py
          python scripts/generate_price_data.py && python scripts/train_price_model.py
          python scripts/generate_trust_data.py && python scripts/train_trust_model.py
          python scripts/build_manifest.py
          python scripts/validate_models.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, ai-service, models, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The AI image bakes in the models and asserts they load — that assertion is the point
      - name: Build ai-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: VITE_API_URL=https://api.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
