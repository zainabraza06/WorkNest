# WorkNest — the whole stack in one command.
#
#   docker compose up --build        →  web http://localhost:8080  ·  api :5000  ·  ai :8000
#
# Requires backend/.env (MONGODB_URI, JWT_SECRET, Stripe/Cloudinary keys). MongoDB itself is
# Atlas, not a container: the app uses geospatial + text indexes and Atlas is where it is
# deployed, so running against it locally keeps dev and prod honest.
#
# Hardening applied to every service (the same posture production should have):
#   - init: true            a real PID 1 that forwards SIGTERM and reaps zombies, so the
#                           graceful-shutdown code in backend/src/server.js actually runs
#   - read_only + tmpfs     the container cannot be written to, only /tmp
#   - cap_drop: ALL         no Linux capabilities; none are needed to serve HTTP on a high port
#   - no-new-privileges     a setuid binary cannot escalate
#   - memory/cpu limits     one runaway service cannot starve its neighbours
#   - healthchecks          `depends_on: service_healthy` waits for ready, not merely started

x-hardened: &hardened
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m' # structured JSON logs are chatty; never let them fill the disk
      max-file: '3'

services:
  ai-service:
    <<: *hardened
    build:
      context: ./ai-service
    environment:
      # Only the backend talks to this service, never the browser
      ALLOWED_ORIGINS: http://backend:5000
      PORT: 8000
      SERVICE_API_KEY: ${AI_SERVICE_KEY:-}
    ports:
      - '127.0.0.1:8000:8000' # loopback only: /docs and debugging, never exposed to the network
    mem_limit: 1g
    cpus: 1.0

  backend:
    <<: *hardened
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Container DNS, not localhost — inside the network the service is reachable by name
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      CLIENT_URL: http://localhost:8080
      # Compose puts no proxy in front of the API, so there is no hop to trust
      TRUST_PROXY_HOPS: 0
    ports:
      - '5000:5000'
    depends_on:
      ai-service:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 20s # longer than SHUTDOWN_TIMEOUT_MS so Docker never SIGKILLs a drain

  frontend:
    <<: *hardened
    build:
      context: ./frontend
      args:
        # Baked in at build time — the browser resolves this, so it is the host's address
        VITE_API_URL: http://localhost:5000
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    environment:
      # Allowed in the Content-Security-Policy connect-src, resolved at container start
      API_ORIGIN: http://localhost:5000
    # nginx-unprivileged renders its config from a template at start-up and keeps temp files
    # under /tmp; it needs those two paths writable on top of the read-only root filesystem.
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d
    ports:
      - '8080:8080'
    depends_on:
      - backend
    mem_limit: 128m
    cpus: 0.5
